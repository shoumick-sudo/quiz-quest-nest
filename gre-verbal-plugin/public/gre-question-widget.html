<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRE Verbal Question</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#171717; background:transparent; }
      * { box-sizing:border-box; }
      body { margin:0; padding:10px; background:transparent; }
      .card { max-width:760px; margin:0 auto; border:1px solid rgba(120,120,120,.25); border-radius:16px; padding:18px; background:rgba(255,255,255,.96); }
      .topline { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
      .badge { display:inline-flex; align-items:center; min-height:26px; padding:4px 9px; border-radius:999px; background:#f3f4f6; font-size:12px; font-weight:650; }
      .progress { margin-left:auto; color:#666; font-size:12px; }
      .passage { white-space:pre-wrap; line-height:1.55; padding:14px; background:#f7f7f8; border-radius:12px; margin:10px 0 14px; }
      .instructions { color:#555; font-size:13px; margin:0 0 8px; }
      .stem { white-space:pre-wrap; line-height:1.55; font-size:16px; margin:0 0 14px; }
      .choices { display:grid; gap:9px; }
      .choice { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:1px solid #d8dadd; border-radius:12px; padding:12px 13px; background:#fff; cursor:pointer; transition:.12s ease; }
      .choice:hover { border-color:#9ca3af; background:#fafafa; }
      .choice.selected { border-color:#4f46e5; background:#f5f3ff; box-shadow:0 0 0 1px #4f46e5 inset; }
      .choice input { margin-top:3px; accent-color:#4f46e5; }
      .choice-key { min-width:22px; font-weight:700; }
      .choice-label { line-height:1.4; }
      .actions { margin-top:16px; display:flex; align-items:center; gap:10px; }
      button.submit { border:0; border-radius:10px; background:#171717; color:white; padding:10px 16px; font-weight:700; cursor:pointer; }
      button.submit:disabled { opacity:.45; cursor:not-allowed; }
      .hint { color:#666; font-size:12px; }
      .status { margin-left:auto; font-size:13px; font-weight:650; }
      .error { color:#b42318; }
      .success { color:#067647; }
      .empty { color:#666; padding:16px; text-align:center; }
      @media (prefers-color-scheme: dark) {
        :root { color:#ececec; }
        .card { background:#202020; border-color:#444; }
        .badge { background:#303030; }
        .passage { background:#2a2a2a; }
        .instructions,.progress,.hint { color:#aaa; }
        .choice { background:#242424; border-color:#4a4a4a; color:#ececec; }
        .choice:hover { background:#2b2b2b; }
        .choice.selected { background:#312e81; border-color:#818cf8; box-shadow:0 0 0 1px #818cf8 inset; }
        button.submit { background:#f2f2f2; color:#151515; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="card"><div class="empty">Loading GRE question…</div></main>
    <script type="module">
      const app = document.querySelector("#app");
      let question = null;
      let selected = new Set();
      let submitted = false;
      let startedAt = Date.now();
      let rpcId = 0;
      const pendingRequests = new Map();

      const rpcNotify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        pendingRequests.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }

      function setQuestion(next) {
        if (!next?.questionId) return;
        question = next;
        submitted = false;
        startedAt = Date.now();
        const saved = window.openai?.widgetState?.privateContent;
        selected = saved?.questionId === next.questionId && Array.isArray(saved.selected)
          ? new Set(saved.selected) : new Set();
        render();
      }

      function updateFromResponse(response) {
        const q = response?.structuredContent?.question;
        if (q) setQuestion(q);
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (typeof message.id === "number") {
          const pending = pendingRequests.get(message.id);
          if (!pending) return;
          pendingRequests.delete(message.id);
          if (message.error) pending.reject(message.error); else pending.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") updateFromResponse(message.params);
      }, { passive: true });

      const bridgeReady = (async () => {
        try {
          await rpcRequest("ui/initialize", {
            appInfo: { name: "gre-question-widget", version: "0.1.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          });
          rpcNotify("ui/notifications/initialized", {});
        } catch (error) {
          console.error("Failed to initialize MCP Apps bridge", error);
        }
      })();

      function selectionLimits() {
        return {
          min: Number(question?.minSelections ?? 1),
          max: Number(question?.maxSelections ?? (question?.choiceMode === "single" ? 1 : 2)),
        };
      }

      function persistUiState() {
        if (!window.openai?.setWidgetState || !question) return;
        window.openai.setWidgetState({
          modelContent: `Learner is viewing GRE question ${question.questionId}.`,
          privateContent: { questionId: question.questionId, selected: [...selected] },
        });
      }

      function choose(id) {
        if (!question || submitted) return;
        const { max } = selectionLimits();
        if (question.choiceMode === "single") selected = new Set([id]);
        else if (selected.has(id)) selected.delete(id);
        else {
          if (selected.size >= max) return;
          selected.add(id);
        }
        persistUiState();
        render();
      }

      function render() {
        if (!question) {
          app.innerHTML = '<div class="empty">Loading GRE question…</div>';
          return;
        }

        const progress = question.progress ? `<span class="progress">Question ${question.progress.current}/${question.progress.total}</span>` : "";
        const passage = question.passage ? `<div class="passage">${escapeHtml(question.passage)}</div>` : "";
        const instructions = question.instructions ? `<p class="instructions">${escapeHtml(question.instructions)}</p>` : "";
        const inputType = question.choiceMode === "single" ? "radio" : "checkbox";

        const choicesHtml = question.choices.map((choice) => {
          const checked = selected.has(choice.id);
          return `
            <label class="choice ${checked ? "selected" : ""}" data-id="${escapeHtml(choice.id)}">
              <input type="${inputType}" name="gre-choice" ${checked ? "checked" : ""} ${submitted ? "disabled" : ""}/>
              <span class="choice-key">${escapeHtml(choice.id)}</span>
              <span class="choice-label">${escapeHtml(choice.label)}</span>
            </label>`;
        }).join("");

        const { min, max } = selectionLimits();
        const ready = selected.size >= min && selected.size <= max && !submitted;
        const selectionHint = question.choiceMode === "single" ? "Select one answer." : `Select ${min === max ? min : `${min}–${max}`} answer${max === 1 ? "" : "s"}.`;

        app.innerHTML = `
          <div class="topline">
            <span class="badge">${escapeHtml(question.questionType)}</span>
            <span class="badge">${escapeHtml(question.difficulty)}</span>
            <span class="badge">${escapeHtml(question.sourceLabel)}</span>
            ${progress}
          </div>
          ${question.title ? `<h3>${escapeHtml(question.title)}</h3>` : ""}
          ${passage}
          ${instructions}
          <div class="stem">${escapeHtml(question.stem)}</div>
          <div class="choices">${choicesHtml}</div>
          <div class="actions">
            <button class="submit" id="submit" ${ready ? "" : "disabled"}>${submitted ? "Submitted" : "Submit answer"}</button>
            <span class="hint">${selectionHint}</span>
            <span class="status" id="status"></span>
          </div>`;

        app.querySelectorAll(".choice").forEach((el) => {
          el.addEventListener("click", (event) => {
            if (event.target?.tagName === "INPUT") event.preventDefault();
            choose(el.dataset.id);
          });
        });
        app.querySelector("#submit")?.addEventListener("click", submitAnswer);
      }

      async function submitAnswer() {
        if (!question || submitted) return;
        const { min, max } = selectionLimits();
        if (selected.size < min || selected.size > max) return;

        const button = app.querySelector("#submit");
        const status = app.querySelector("#status");
        if (button) button.disabled = true;
        if (status) status.textContent = "Submitting…";

        const elapsedSeconds = Math.max(0, Math.round((Date.now() - startedAt) / 1000));
        const selectedIds = [...selected];

        try {
          await bridgeReady;
          const response = await rpcRequest("tools/call", {
            name: "submit_gre_answer",
            arguments: { questionId: question.questionId, selected: selectedIds, elapsedSeconds },
          });

          if (!response?.structuredContent?.submission?.accepted) throw new Error("Answer was not accepted");

          submitted = true;
          persistUiState();
          render();
          const nextStatus = app.querySelector("#status");
          if (nextStatus) {
            nextStatus.textContent = "Answer sent";
            nextStatus.classList.add("success");
          }

          const prompt = `GRE widget submission: question ${question.questionId}; selected answer choice(s): ${selectedIds.join(", ")}; elapsed time: ${elapsedSeconds}s. Continue according to the current GRE tutor mode. In Practice mode, evaluate and teach briefly, then render the next question. In Test mode, do not reveal correctness; render the next question.`;
          if (window.openai?.sendFollowUpMessage) {
            await window.openai.sendFollowUpMessage({ prompt, scrollToBottom: true });
          }
        } catch (error) {
          console.error("Failed to submit GRE answer", error);
          const nextStatus = app.querySelector("#status");
          if (nextStatus) {
            nextStatus.textContent = "Submission failed";
            nextStatus.classList.add("error");
          }
          const nextButton = app.querySelector("#submit");
          if (nextButton) nextButton.disabled = false;
        }
      }

      if (window.openai?.toolOutput?.question) setQuestion(window.openai.toolOutput.question);
    </script>
  </body>
</html>
